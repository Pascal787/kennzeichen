name: Kennzeichen-Wächter

on:
  schedule:
    # GitHub startet geplante Läufe unzuverlässig (verspätet oder gar nicht). Deshalb wird alle
    # 5 Minuten angeklopft; das Skript prüft nur, wenn der letzte Lauf ≥ 24 Min. her ist.
    - cron: "4-59/5 * * * *"
  workflow_dispatch:          # „Run workflow“-Knopf für einen Lauf von Hand – und der externe Wecker
    inputs:
      test:
        description: "Nur Testbenachrichtigung senden"
        type: boolean
        default: false
      automatisch:
        description: "Vom Wecker (cron-job.org) – dann wie geplante Läufe mit Mindestabstand"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4

      - name: Freie Kennzeichen prüfen
        env:
          KZ_CONFIG: ${{ secrets.KZ_CONFIG }}
          GMAIL_APP_PASSWORT: ${{ secrets.GMAIL_APP_PASSWORT }}
          KZ_ZUSTAND: waechter/zustand.json
          KZ_WEBSITE: .
          KZ_MINDESTABSTAND_MIN: ${{ (github.event_name == 'schedule' || inputs.automatisch) && '24' || '0' }}
        run: python3 waechter/kennzeichen_bot.py ${{ inputs.test && '--test' || '' }}

      - name: Ergebnis speichern
        if: ${{ !inputs.test }}
        run: |
          git config user.name "kennzeichen-waechter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten.json waechter/zustand.json
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -q -m "Daten $(date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
